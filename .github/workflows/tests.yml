name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gateway:
    name: Gateway tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: gateway/requirements.txt
      - name: Install dependencies
        working-directory: gateway
        run: pip install -r requirements.txt
      # The tests use fake models and fake backends: no API key and no database are needed.
      # Tests that need a live PostgreSQL are skipped automatically.
      - name: Run tests
        working-directory: gateway
        run: python -m pytest -q

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Run tests
        working-directory: backend
        run: python -m pytest -q tests
